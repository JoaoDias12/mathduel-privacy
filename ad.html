<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Site oficial da SoMoth, desenvolvedora do Math Duel.">
  <title>SoMoth | Clash</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: Arial, sans-serif;
      color: #172033;
      background: #f7faff;
    }

    main {
      width: min(620px, 100%);
      text-align: center;
    }

    .brand {
      margin: 0 0 12px;
      font-size: 48px;
      color: #f0a21a;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 32px;
    }

    p {
      margin: 0 auto 12px;
      max-width: 520px;
      line-height: 1.6;
      color: #566176;
    }

    footer {
      margin-top: 48px;
      font-size: 14px;
      color: #7c879a;
    }
  </style>
</head>

<body>
  <main>
    <div class="brand">SoMoth</div>
    <h1>Math Clash</h1>

    <p>
      Um duelo matematico competitivo no qual cada jogador usa numeros
      e operadores para chegar o mais perto possivel do alvo.
    </p>

    <p>Desenvolvido pela SoMoth.</p>

    <footer>
      &copy; 2026 SoMoth. Todos os direitos reservados.
    </footer>
  </main>
</body>
</html>
